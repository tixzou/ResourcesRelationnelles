name: CI

# Integration continue : a chaque push sur main et sur chaque Pull Request,
# on installe, teste et build le backend et le frontend.
# Vercel deploie ensuite automatiquement depuis GitHub (voir plan de deploiement).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS) - tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valeurs factices : les tests sont mockes (aucune vraie base requise).
      # DATABASE_URL doit exister pour `prisma generate` (pas de connexion).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      JWT_SECRET: "ci_test_secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (+ prisma generate via postinstall)
        run: npm ci
      - name: Tests (unit + functional + regression)
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (Next.js) - tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests (unit + functional + regression)
        run: npm test
      - name: Build
        run: npm run build
