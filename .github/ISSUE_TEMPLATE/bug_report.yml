name: "🐛 Signalement de bug"
description: Signaler un dysfonctionnement ou un incident afin qu'il soit corrigé.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Décrivez clairement le dysfonctionnement observé.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - Bloquant (incident critique)
        - Majeur
        - Mineur
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "Production / Local, navigateur, système d'exploitation"
